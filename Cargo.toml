[package]
name = "crabcrust"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["CrabCrust Contributors"]
description = "Add arcade-style animations to your CLI tools 🦀✨"
license = "MIT OR Apache-2.0"
repository = "https://github.com/newjordan/CrabCrust"
keywords = ["cli", "terminal", "animation", "braille", "arcade"]
categories = ["command-line-utilities", "visualization"]
readme = "README.md"

[[bin]]
name = "crabcrust"
path = "src/main.rs"

[[bin]]
name = "convert_to_embedded"
path = "tools/convert_to_embedded.rs"
required-features = ["video"]

[[bin]]
name = "calibrate_animation"
path = "tools/calibrate_animation.rs"
required-features = ["video"]

[dependencies]
# Terminal rendering
ratatui = "0.30"
crossterm = "0.29"

# CLI argument parsing
clap = { version = "4.6", features = ["derive", "cargo"] }

# Error handling
anyhow = "1.0"

# Async runtime (for non-blocking command execution)
tokio = { version = "1", features = ["full"] }

# Video and image processing (optional)
image = { version = "0.25", optional = true }
ffmpeg-next = { version = "9.1", optional = true }
tempfile = { version = "3.27", optional = true }

[features]
default = []
gif = ["image"]
video = ["gif", "ffmpeg-next", "tempfile"]

[dev-dependencies]
insta = "1.49"
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
